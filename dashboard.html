<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - ConectaReciclaje</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="container nav-bar">
            <h1 class="logo">ConectaReciclaje</h1>
            <nav>
                <span id="userGreeting">Hola</span>
                <button id="btnLogout" class="btn btn-outline">Cerrar Sesión</button>
            </nav>
        </div>
    </header>
    <main class="container dashboard-main">
        <div id="ciudadanoView" style="display:none;">
            <h2>Mis Solicitudes</h2>
            <button class="btn btn-primary mb-3" onclick="document.getElementById('solicitudModal').style.display='block'">Nueva Solicitud</button>
            <div class="table-responsive">
                <table id="tableCiudadano">
                    <thead><tr><th>Material</th><th>Cantidad</th><th>Estado</th><th>Fecha</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        
        <div id="recicladorView" style="display:none;">
            <h2>Solicitudes Disponibles</h2>
            <div class="table-responsive">
                <table id="tableReciclador">
                    <thead><tr><th>Ciudadano</th><th>Material</th><th>Ubicación</th><th>Acción</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <h2 class="mt-3">Mis Recolecciones</h2>
            <div class="table-responsive">
                <table id="tableMisRecolecciones">
                    <thead><tr><th>Material</th><th>Ubicación</th><th>Estado</th><th>Acción</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        
        <div id="adminView" style="display:none;">
            <h2>Administración de Sistema</h2>
            <p>Solo visible para administradores.</p>
        </div>
    </main>

    <!-- Modal Nueva Solicitud -->
    <div id="solicitudModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="document.getElementById('solicitudModal').style.display='none'">&times;</span>
            <h2>Nueva Solicitud</h2>
            <form id="formSolicitud">
                <div class="form-group">
                    <label>Material:</label>
                    <input type="text" id="solMaterial" required>
                </div>
                <div class="form-group">
                    <label>Cantidad (aprox):</label>
                    <input type="text" id="solCantidad" required>
                </div>
                <div class="form-group">
                    <label>Dirección:</label>
                    <input type="text" id="solDireccion" required>
                </div>
                <button type="button" class="btn btn-outline mb-3" id="btnLocation">Usar mi ubicación actual</button>
                <input type="hidden" id="solLat">
                <input type="hidden" id="solLng">
                <button type="submit" class="btn btn-primary btn-block">Publicar</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
