<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - ConectaReciclaje</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container form-container">
        <h1 class="logo text-center">ConectaReciclaje</h1>
        <h2>Registro de Usuario</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Nombre Completo:</label>
                <input type="text" id="nombre" required>
            </div>
            <div class="form-group">
                <label>Correo Electrónico:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Contraseña:</label>
                <input type="password" id="password" required>
            </div>
            <div class="form-group">
                <label>Tipo de Usuario:</label>
                <select id="rol">
                    <option value="ciudadano">Ciudadano</option>
                    <option value="reciclador">Reciclador</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Registrarse</button>
            <p id="regError" class="error"></p>
            <p id="regSuccess" class="success"></p>
        </form>
        <p class="text-center mt-3"><a href="login.html">Volver al inicio de sesión</a></p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
